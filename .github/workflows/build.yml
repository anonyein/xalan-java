name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:      

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/trunk' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Java 8'
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout xalan-java'
      uses: actions/checkout@v3
      
    - name: 'Set up JDK 8'
      uses: actions/setup-java@v2
      with:
        distribution: zulu
        java-version: 8
        
    - name: 'Install dependencies to local Maven repo'
      run: |
        # 创建Maven本地仓库目录
        mkdir -p libs
        
        # 自动安装libs目录下的所有JAR
        for jar_file in libs/*.jar; do
          # 从文件名解析groupId和artifactId
          filename=$(basename "$jar_file")
          artifact_id="${filename%-*}"
          version="${filename##*-}"
          version="${version%.jar}"
          
          # 安装到本地仓库
          mvn install:install-file \
            -Dfile="$jar_file" \
            -DgroupId=local.libs \
            -DartifactId="$artifact_id" \
            -Dversion="$version" \
            -Dpackaging=jar \
            -DlocalRepositoryPath=libs
        done
        
    - name: 'Build Xalan jars with local dependencies'
      run: |
        # 创建自定义settings.xml
        cat <<EOF > settings.xml
        <settings>
          <localRepository>\${basedir}/libs</localRepository>
          <profiles>
            <profile>
              <id>local-repo</id>
              <repositories>
                <repository>
                  <id>local-libs</id>
                  <url>file://\${basedir}/libs</url>
                  <releases><enabled>true</enabled></releases>
                  <snapshots><enabled>false</enabled></snapshots>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>local-repo</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        
        # 使用自定义设置运行Maven
        mvn -s settings.xml clean install test -Dtest=AllXalanXSLT3Tests -Dmaven.repo.local=libs
        
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: upload-jar
        path: /home/runner/work/xalan-java/xalan-java/build/*jar
        
    - name: Upload lib
      uses: actions/upload-artifact@v4
      with:
        name: native-lib
        path: /home/runner/work/xalan-java/xalan-java/lib
