name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:      

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/trunk' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Java 8'
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout xalan-java'
      uses: actions/checkout@v3
      
    - name: 'Set up JDK 8'
      uses: actions/setup-java@v2
      with:
        distribution: zulu
        java-version: 8
        
    - name: List libs directory (for debugging)
      run: |
        echo "Checking libs directory:"
        ls -la libs/
        echo "JAR files in libs:"
        find libs/ -name "*.jar" -print
        
    - name: 'Install dependencies to local Maven repo'
      run: |
        # 确保libs目录存在
        mkdir -p libs
        
        # 查找所有JAR文件并安装
        find libs -name "*.jar" -print0 | while IFS= read -r -d '' jar_file; do
          # 从路径解析文件名
          filename=$(basename "$jar_file")
          
          # 移除扩展名
          no_extension="${filename%.jar}"
          
          # 分割artifactId和version (假设格式为name-version)
          artifact_id="${no_extension%-*}"
          version="${no_extension##*-}"
          
          echo "Installing: $jar_file"
          echo "Group: local.libs, Artifact: $artifact_id, Version: $version"
          
          # 安装到本地仓库
          mvn install:install-file \
            -Dfile="$jar_file" \
            -DgroupId=local.libs \
            -DartifactId="$artifact_id" \
            -Dversion="$version" \
            -Dpackaging=jar \
            -DlocalRepositoryPath=libs \
            -DcreateChecksum=true
        done
        
    - name: 'Build Xalan jars with local dependencies'
      run: |
        # 创建自定义settings.xml
        cat <<EOF > settings.xml
        <settings>
          <localRepository>\${basedir}/libs</localRepository>
          <profiles>
            <profile>
              <id>local-repo</id>
              <repositories>
                <repository>
                  <id>local-libs</id>
                  <url>file://\${basedir}/libs</url>
                  <releases>
                    <enabled>true</enabled>
                    <updatePolicy>never</updatePolicy>
                  </releases>
                  <snapshots>
                    <enabled>false</enabled>
                  </snapshots>
                </repository>
              </repositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>local-repo</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        
        # 使用自定义设置运行Maven
        mvn -s settings.xml clean install test -Dtest=AllXalanXSLT3Tests -Dmaven.repo.local=libs -B
        
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: upload-jar
        path: build/*jar
        
    - name: Upload lib
      uses: actions/upload-artifact@v4
      with:
        name: native-lib
        path: lib
