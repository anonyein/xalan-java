name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:      

permissions:
  contents: read

concurrency:
  group: ${{ github.ref == 'refs/heads/trunk' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Java 8'
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout xalan-java'
      uses: actions/checkout@v3
      
    - name: 'Set up JDK 8'
      uses: actions/setup-java@v2
      with:
        distribution: zulu
        java-version: 8
        
    - name: 'Correct file paths and install dependencies'
      run: |
        # 修复Jlex路径大小写问题
        mkdir -p libs/jlex/jlex/1.0
        cp "libs/JLex/JLex/1.0/jlex-1.0.jar" "libs/jlex/jlex/1.0/jlex-1.0.jar"
        
        # 为所有依赖创建正确的Maven结构
        declare -A dep_map=(
          ["Jlex"]="Jlex:Jlex:1.0"
          ["java_cup"]="edu.princeton.cs:java_cup:1.0"
          ["cup_runtime"]="edu.princeton.cs:cup_runtime:1.0"
          ["xpath31_types"]="org.apache.xsl:xpath31_types:1.0"
          ["xercesImpl"]="org.apache.xerces:xercesImpl:2.12.3"
          ["xml-apis"]="org.apache.xerces:xml-apis:1.4.02"
          ["bsf"]="org.apache.commons:bsf:1.0"
        )
        
        for jar_path in libs/*/*/*/*.jar; do
          # 提取文件名（不带路径）
          jar_file=$(basename "$jar_path")
          
          # 确定依赖名称（文件名去掉版本信息）
          dep_name=$(echo "$jar_file" | sed -E 's/-[0-9.]+\.jar$//')
          
          # 获取坐标（如果映射中不存在则使用默认值）
          if [[ -n "${dep_map[$dep_name]}" ]]; then
            IFS=':' read -r groupId artifactId version <<< "${dep_map[$dep_name]}"
          else
            # 从路径推断坐标
            path_parts=($(echo "$jar_path" | tr '/' ' '))
            groupId=$(echo "${path_parts[1]}.${path_parts[2]}.${path_parts[3]}" | tr '[:upper:]' '[:lower:]')
            artifactId="$dep_name"
            version=$(echo "$jar_file" | grep -oE '[0-9.]+' | head -1)
          fi
          
          # 创建目标目录（小写处理）
          target_dir="libs/$(echo "$groupId" | tr '.' '/')/$(echo "$artifactId" | tr '[:upper:]' '[:lower:]')/$version"
          mkdir -p "$target_dir"
          
          # 复制文件到目标位置
          target_file="$target_dir/${artifactId}-${version}.jar"
          cp "$jar_path" "$target_file"
          
          # 安装到本地仓库
          mvn install:install-file \
            -Dfile="$target_file" \
            -DgroupId="$groupId" \
            -DartifactId="$artifactId" \
            -Dversion="$version" \
            -Dpackaging=jar \
            -DlocalRepositoryPath=libs \
            -DcreateChecksum=true
        done
        
    - name: 'Build Xalan jars with local dependencies'
      run: |
        # 创建强离线settings.xml
        cat <<EOF > settings.xml
        <settings>
          <localRepository>\${basedir}/libs</localRepository>
          <offline>true</offline>
          <mirrors>
            <mirror>
              <id>local-only</id>
              <url>file://\${basedir}/libs</url>
              <mirrorOf>*</mirrorOf>
            </mirror>
          </mirrors>
          <profiles>
            <profile>
              <id>disable-repos</id>
              <repositories>
                <repository>
                  <id>central</id>
                  <url>http://0.0.0.0/</url>
                </repository>
              </repositories>
              <pluginRepositories>
                <pluginRepository>
                  <id>central</id>
                  <url>http://0.0.0.0/</url>
                </pluginRepository>
              </pluginRepositories>
            </profile>
          </profiles>
          <activeProfiles>
            <activeProfile>disable-repos</activeProfile>
          </activeProfiles>
        </settings>
        EOF
        
        # 运行Maven构建（强制离线模式）
        mvn -s settings.xml clean install test \
          -Dtest=AllXalanXSLT3Tests \
          -Dmaven.repo.local=libs \
          -o \
          -B \
          --fail-never
        
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: upload-jar
        path: build/*jar
        
    - name: Upload lib
      uses: actions/upload-artifact@v4
      with:
        name: native-lib
        path: lib
