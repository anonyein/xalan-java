name: CI

on:
  push:
    branches:
      - '*'
  pull_request:
    branches:
      - '*'
    types:
      - opened
      - edited
      - synchronize
      - reopened
  workflow_dispatch:      

permissions:
  contents: read

# https://help.github.com/en/actions/automating-your-workflow-with-github-actions/software-installed-on-github-hosted-runners
# GitHub Actions does not support Docker, PostgreSQL server on Windows, macOS :(

concurrency:
  # On master/release, we don't want any jobs cancelled so the sha is used to name the group
  # On PR branches, we cancel the job if new commits are pushed
  # More info: https://stackoverflow.com/a/68422069/253468
  group: ${{ github.ref == 'refs/heads/trunk' && format('ci-main-{0}', github.sha) || format('ci-main-{0}', github.ref) }}
  cancel-in-progress: true

jobs:
  build:
    name: 'Java 8'
    runs-on: ubuntu-latest
    steps:
    - name: 'Checkout xalan-java'
      uses: actions/checkout@v3
      
    - name: 'Set up JDK 8'
      uses: actions/setup-java@v2
      with:
        distribution: zulu
        java-version: 8
        
    - name: 'Build Xalan jars with local dependencies'
      run: |
        # 添加本地仓库配置
        echo '<settings>' > settings.xml
        echo '  <localRepository>${basedir}/libs</localRepository>' >> settings.xml
        echo '  <profiles>' >> settings.xml
        echo '    <profile>' >> settings.xml
        echo '      <id>local-repo</id>' >> settings.xml
        echo '      <repositories>' >> settings.xml
        echo '        <repository>' >> settings.xml
        echo '          <id>local-libs</id>' >> settings.xml
        echo '          <url>file://${basedir}/libs</url>' >> settings.xml
        echo '          <releases><enabled>true</enabled></releases>' >> settings.xml
        echo '          <snapshots><enabled>true</enabled></snapshots>' >> settings.xml
        echo '        </repository>' >> settings.xml
        echo '      </repositories>' >> settings.xml
        echo '    </profile>' >> settings.xml
        echo '  </profiles>' >> settings.xml
        echo '  <activeProfiles>' >> settings.xml
        echo '    <activeProfile>local-repo</activeProfile>' >> settings.xml
        echo '  </activeProfiles>' >> settings.xml
        echo '</settings>' >> settings.xml
        
        # 使用自定义设置运行 Maven
        mvn -s settings.xml clean install test -Dtest=AllXalanXSLT3Tests
        
    - name: Upload jar
      uses: actions/upload-artifact@v4
      with:
        name: upload-jar
        path: /home/runner/work/xalan-java/xalan-java/build/*jar
        
    - name: Upload lib
      uses: actions/upload-artifact@v4
      with:
        name: native-lib
        path: /home/runner/work/xalan-java/xalan-java/lib
